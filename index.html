<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Toolkit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Toolkit</h1>
    </header>
        <div class="toolbar">
        <input type="file" id="imageInput" accept="image/*">
        <label>Width: <input type="number" id="widthInput"></label>
        <label>Height: <input type="number" id="heightInput"></label>
        <label><input type="checkbox" id="lockRatio"> Lock Aspect Ratio</label>
        <button id="resizeBtn">Resize</button>

        <button id="rotateBtn">Rotate</button>
        <button id="grayscaleBtn">Grayscale</button>
        <button id="sepiaBtn">Sepia</button>
        <button id="resetColorsBtn">Reset Colors</button>
        <button id="downloadBtn">Download</button>
    </div>

    <canvas id="imageCanvas" width="600" height="600"></canvas>

    <script src="script.js"></script>
</body>
</html>
